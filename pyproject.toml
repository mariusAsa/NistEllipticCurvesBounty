[project]
name = "seeds-bounty"
version = "0.0.1"
description = "Use a local LLM to guess the English pre-seeds of the NIST elliptic curve seeds"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub",
    "mlx-lm",
    "python-dotenv",
]

[project.scripts]
seeds-bounty = "src.main:main"

[tool.uv.build-backend]
# The package is the top-level `src` directory itself, not `src/<name>/`.
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm.git" }
